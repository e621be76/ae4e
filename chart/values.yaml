# repository and tag are bumped by CI (.github/workflows/ci.yml) after each image push
image:
  repository: ghcr.io/e621be76/quote-api
  tag: sha-0a07218
  pullPolicy: IfNotPresent

containerPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 64Mi

autoscaling:
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  minAvailable: 2

ingress:
  className: traefik
