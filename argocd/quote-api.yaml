# REPO_URL and REVISION are filled in by scripts/20-deploy.sh from the clone's git remote
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quote-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPO_URL
    targetRevision: REVISION
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: quote
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
