# Karpenter v1 API (karpenter.k8s.aws/v1), checked against the v1.15.1 CRDs
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: KarpenterNodeRole-prod # IAM role for the nodes, created with the cluster
  # al2023 alias resolves to the NVIDIA variant (drivers + container toolkit) on GPU instance types
  # shortcut: @latest rolls nodes whenever AWS ships an AMI, pin al2023@vYYYYMMDD in prod and bump deliberately
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: prod
  # model weights and CUDA images are large; the default 20Gi root fills up on the first pull
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpTokens: required # IMDSv2 only
    httpPutResponseHopLimit: 1 # pods can't reach node credentials; use Pod Identity instead
  tags:
    team: ai-platform
